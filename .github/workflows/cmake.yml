name: CMake

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  create:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-2022
            compiler:
              - llvm-22
          - name: Linux
            os: ubuntu-24.04
            compiler:
              - llvm-22
              - gcc-15
    steps:

    - name: Install Toolchain
      uses: aminya/setup-cpp@v1
      with:
        compiler: ${{ matrix.config.compiler }}
        ninja: true

    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Setup CPM Cache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/.cpm-cache
        key: ${{ runner.os }}-cpm-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cpm-

    - name: Configure CMake
      run: cmake --preset Release -DCPM_SOURCE_CACHE=${{ github.workspace }}/.cpm-cache

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --parallel

    - name: Run Tests
      run: ctest --test-dir ${{ github.workspace }}/build --rerun-failed --output-on-failure

    - name: Upload Artifacts
      if: github.ref_type == 'tag'
      uses: actions/upload-artifact@v4
      with:
        name: release-assets-${{ matrix.config.name }}
        if-no-files-found: ignore
        path: |
          ${{ github.workspace }}/build/glsld
          ${{ github.workspace }}/build/glsld.exe
          ${{ github.workspace }}/build/glsld-wrapper
          ${{ github.workspace }}/build/glsld-wrapper.exe

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/release-assets/*
